[project]
name = "lecture-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "luffy", email = "pr704717@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.3",
    "faster-whisper>=1.2.1",
    "google-genai>=2.31.0",
    "nvidia-cublas-cu12>=12.9.2.10",
    "nvidia-cudnn-cu12==9.*",
    "ollama>=0.6.3",
    "pydantic>=2.14.1",
    "reportlab>=5.1.0",
    "uvicorn>=0.54.0",
    "yt-dlp>=2026.8.19",
]

[project.scripts]
lecture-assistant = "lecture_assistant:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
