<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EchoNotes — Lecture Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --card-border-hover: #cbd5e1;
      --text-main: #0f172a;
      --text-secondary: #475569;
      --text-muted: #94a3b8;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --accent-subtle: #eff6ff;
      --important-bg: #fffbeb;
      --important-border: #fcd34d;
      --important-text: #b45309;
      --important-badge-bg: #fef3c7;
      --badge-bg: #f1f5f9;
      --badge-text: #334155;
      --success: #16a34a;
      --radius: 8px;
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.04);
      --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.05), 0 2px 4px -2px rgb(0 0 0 / 0.05);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text-main);
      line-height: 1.5;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    .header-bar {
      background: var(--card-bg);
      border-bottom: 1px solid var(--card-border);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .header-inner {
      max-width: 1020px;
      margin: 0 auto;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 32px;
      height: 32px;
      background: #0f172a;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      flex-shrink: 0;
    }

    .brand-title {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-subtitle {
      font-size: 12px;
      color: var(--text-secondary);
      font-weight: 400;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
      background: var(--badge-bg);
      border: 1px solid var(--card-border);
      padding: 5px 10px;
      border-radius: 20px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--success);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      padding: 7px 12px;
      border-radius: 6px;
      border: 1px solid transparent;
      cursor: pointer;
      text-decoration: none;
      transition: background-color 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
      white-space: nowrap;
    }

    .btn-secondary {
      background: var(--card-bg);
      border-color: var(--card-border);
      color: var(--text-main);
      box-shadow: var(--shadow-sm);
    }

    .btn-secondary:hover {
      background: #f8fafc;
      border-color: var(--card-border-hover);
    }

    .btn-primary {
      background: #0f172a;
      color: #ffffff;
      border-color: #0f172a;
    }

    .btn-primary:hover {
      background: #1e293b;
      border-color: #1e293b;
    }

    .btn-pdf {
      background: #fef2f2;
      color: #991b1b;
      border-color: #fecaca;
    }

    .btn-pdf:hover {
      background: #fee2e2;
      border-color: #f87171;
    }

    .btn-icon {
      width: 14px;
      height: 14px;
      stroke-width: 2;
    }

    .container {
      max-width: 1020px;
      margin: 0 auto;
      padding: 24px 20px 48px;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--card-border);
    }

    nav.tab-group {
      display: inline-flex;
      background: #e2e8f0;
      padding: 3px;
      border-radius: 8px;
      gap: 2px;
      flex-wrap: wrap;
    }

    nav.tab-group button {
      border: none;
      background: transparent;
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
      padding: 6px 13px;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.15s ease, color 0.15s ease;
    }

    nav.tab-group button:hover {
      color: var(--text-main);
    }

    nav.tab-group button.on {
      background: var(--card-bg);
      color: var(--text-main);
      font-weight: 600;
      box-shadow: var(--shadow-sm);
    }

    .filter-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .search-input-wrap {
      position: relative;
    }

    .search-input {
      font-family: inherit;
      font-size: 13px;
      padding: 6px 12px 6px 30px;
      border-radius: 6px;
      border: 1px solid var(--card-border);
      background: var(--card-bg);
      color: var(--text-main);
      width: 180px;
      transition: border-color 0.15s ease, width 0.2s ease;
    }

    .search-input:focus {
      outline: none;
      border-color: var(--accent);
      width: 220px;
    }

    .search-icon {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      width: 13px;
      height: 13px;
      color: var(--text-muted);
      pointer-events: none;
    }

    .filter-pill {
      font-family: inherit;
      font-size: 12px;
      font-weight: 500;
      padding: 6px 11px;
      border-radius: 6px;
      border: 1px solid var(--card-border);
      background: var(--card-bg);
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .filter-pill.active {
      background: #0f172a;
      border-color: #0f172a;
      color: #ffffff;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: var(--shadow-sm);
      transition: border-color 0.15s ease;
    }

    .card:hover {
      border-color: var(--card-border-hover);
    }

    .card.important {
      border-left: 4px solid var(--important-border);
      background: #ffffff;
    }

    .card-head {
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid #f1f5f9;
    }

    .card-meta-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }

    .pill-group {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .timestamp {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 500;
      color: var(--text-secondary);
      background: var(--badge-bg);
      border: 1px solid #e2e8f0;
      padding: 2px 7px;
      border-radius: 4px;
      letter-spacing: -0.01em;
    }

    .card-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-main);
      line-height: 1.4;
    }

    /* Badges */
    .badge-pill {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .badge-core {
      background: #eff6ff;
      color: #1e40af;
      border: 1px solid #bfdbfe;
    }

    .badge-high {
      background: #fef3c7;
      color: #92400e;
      border: 1px solid #fde68a;
    }

    .badge-moderate {
      background: #f1f5f9;
      color: #475569;
      border: 1px solid #e2e8f0;
    }

    .badge-diff-intro {
      background: #ecfdf5;
      color: #065f46;
      border: 1px solid #a7f3d0;
    }

    .badge-diff-inter {
      background: #f8fafc;
      color: #334155;
      border: 1px solid #cbd5e1;
    }

    .badge-diff-adv {
      background: #fff1f2;
      color: #9f1239;
      border: 1px solid #fecdd3;
    }

    .badge-important {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--important-text);
      background: var(--important-badge-bg);
      border: 1px solid #fde68a;
      padding: 2px 8px;
      border-radius: 4px;
      white-space: nowrap;
    }

    /* Content styling */
    .note-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .note-list li {
      position: relative;
      padding-left: 18px;
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.6;
    }

    .note-list li::before {
      content: "";
      position: absolute;
      left: 3px;
      top: 10px;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #64748b;
    }

    .concept-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    .concept-item {
      background: #f8fafc;
      border: 1px solid var(--card-border);
      border-radius: 6px;
      padding: 12px 14px;
    }

    .concept-term {
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 4px;
    }

    .concept-def {
      font-size: 13.5px;
      color: var(--text-secondary);
      line-height: 1.5;
    }

    .quiz-item {
      padding: 14px;
      background: #f8fafc;
      border: 1px solid var(--card-border);
      border-radius: 6px;
      margin-bottom: 12px;
    }

    .quiz-item:last-child {
      margin-bottom: 0;
    }

    .quiz-question {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 10px;
      line-height: 1.4;
    }

    .quiz-options {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 12px;
    }

    .quiz-option {
      font-size: 13px;
      color: var(--text-secondary);
      background: #ffffff;
      border: 1px solid var(--card-border);
      padding: 6px 10px;
      border-radius: 4px;
    }

    .quiz-answer-toggle {
      margin-top: 8px;
    }

    .quiz-answer-btn {
      background: transparent;
      border: none;
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      color: var(--accent);
      cursor: pointer;
      padding: 0;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .quiz-answer-btn:hover {
      text-decoration: underline;
    }

    .quiz-answer-box {
      margin-top: 8px;
      padding: 10px 12px;
      background: #f1f5f9;
      border-left: 3px solid #64748b;
      font-size: 13px;
      color: var(--text-main);
      border-radius: 0 4px 4px 0;
    }

    /* Study resources styling */
    .resource-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .resource-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      font-size: 13.5px;
      color: #1e293b;
      background: #f8fafc;
      border: 1px solid var(--card-border);
      border-left: 3px solid #3b82f6;
      border-radius: 0 6px 6px 0;
      padding: 11px 14px;
      line-height: 1.5;
    }

    .resource-icon {
      width: 16px;
      height: 16px;
      color: #3b82f6;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .mini-resources-wrap {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px dashed var(--card-border);
    }

    .mini-resources-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    .mini-resource-tag {
      display: inline-block;
      font-size: 12px;
      color: #1d4ed8;
      background: #eff6ff;
      border: 1px solid #dbeafe;
      padding: 3px 8px;
      border-radius: 4px;
      margin-right: 6px;
      margin-bottom: 6px;
    }

    .action-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .action-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      font-size: 13.5px;
      color: var(--text-secondary);
      background: #f8fafc;
      border: 1px solid var(--card-border);
      border-radius: 6px;
      padding: 10px 12px;
    }

    .action-bullet {
      width: 14px;
      height: 14px;
      border: 1.5px solid #94a3b8;
      border-radius: 3px;
      margin-top: 2px;
      flex-shrink: 0;
    }

    .empty-text {
      font-size: 13px;
      color: var(--text-muted);
      font-style: italic;
    }

    .empty-state {
      text-align: center;
      padding: 56px 20px;
      background: var(--card-bg);
      border: 1px dashed var(--card-border);
      border-radius: var(--radius);
    }

    .empty-state-icon {
      width: 40px;
      height: 40px;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .empty-state-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 4px;
    }

    .empty-state-desc {
      font-size: 13px;
      color: var(--text-secondary);
      max-width: 380px;
      margin: 0 auto;
    }

    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #0f172a;
      color: #ffffff;
      padding: 10px 16px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      box-shadow: var(--shadow-md);
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.2s ease, transform 0.2s ease;
      pointer-events: none;
      z-index: 100;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 768px) {
      .header-inner {
        flex-direction: column;
        align-items: flex-start;
      }
      .header-actions {
        width: 100%;
        justify-content: flex-start;
      }
      .toolbar {
        flex-direction: column;
        align-items: stretch;
      }
      .search-input {
        width: 100%;
      }
      .search-input:focus {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <header class="header-bar">
    <div class="header-inner">
      <div class="brand">
        <div class="brand-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
          </svg>
        </div>
        <div>
          <div class="brand-title">EchoNotes</div>
          <div class="brand-subtitle">Real-time Lecture Transcription and Structured Digest</div>
        </div>
      </div>
      <div class="header-actions">
        <div class="status-pill" id="ws-status">
          <span class="status-dot"></span>
          <span>Live Session</span>
        </div>
        <button class="btn btn-primary" onclick="mark()">
          <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
          </svg>
          <span>Mark Section</span>
        </button>
        <a class="btn btn-pdf" href="/export.pdf" download="lecture-summary.pdf">
          <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="12" y1="18" x2="12" y2="12"></line>
            <polyline points="9 15 12 18 15 15"></polyline>
          </svg>
          <span>Download PDF</span>
        </a>
        <a class="btn btn-secondary" href="/export.md" download="lecture-notes.md">
          <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
          <span>Export Markdown</span>
        </a>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="toolbar">
      <nav class="tab-group" id="nav-tabs"></nav>
      <div class="filter-group">
        <div class="search-input-wrap">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" id="search-input" class="search-input" placeholder="Search notes..." oninput="handleSearch(this.value)">
        </div>
        <button id="filter-important" class="filter-pill" onclick="toggleImportantFilter()">Important Only</button>
      </div>
    </div>

    <div id="view"></div>
  </main>

  <div id="toast" class="toast"></div>

  <script>
    const tabs = [
      { id: "notes", label: "Lecture Notes" },
      { id: "concepts", label: "Key Concepts" },
      { id: "quiz", label: "Review Questions" },
      { id: "resources", label: "Study Resources" },
      { id: "actions", label: "Action Items" }
    ];

    let data = [];
    let currentTab = "notes";
    let searchQuery = "";
    let filterOnlyImportant = false;
    const revealedAnswers = new Set();

    // Render tab navigation
    document.getElementById("nav-tabs").innerHTML = tabs.map(t => 
      `<button id="tab_${t.id}" onclick="setTab('${t.id}')">${t.label}</button>`
    ).join("");

    function setTab(tabId) {
      currentTab = tabId;
      render();
    }

    function handleSearch(q) {
      searchQuery = q.trim().toLowerCase();
      render();
    }

    function toggleImportantFilter() {
      filterOnlyImportant = !filterOnlyImportant;
      document.getElementById("filter-important").classList.toggle("active", filterOnlyImportant);
      render();
    }

    function toggleAnswer(answerId) {
      if (revealedAnswers.has(answerId)) {
        revealedAnswers.delete(answerId);
      } else {
        revealedAnswers.add(answerId);
      }
      render();
    }

    function esc(s) {
      return String(s || "").replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
    }

    function mmss(s) {
      const mins = Math.floor(s / 60);
      const secs = String(Math.round(s % 60)).padStart(2, "0");
      return `${mins}:${secs}`;
    }

    function showToast(msg) {
      const toast = document.getElementById("toast");
      toast.textContent = msg;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 2800);
    }

    function getImportanceClass(imp) {
      if (!imp) return "badge-core";
      const s = imp.toLowerCase();
      if (s.includes("core")) return "badge-core";
      if (s.includes("high")) return "badge-high";
      return "badge-moderate";
    }

    function getDifficultyClass(diff) {
      if (!diff) return "badge-diff-inter";
      const s = diff.toLowerCase();
      if (s.includes("intro")) return "badge-diff-intro";
      if (s.includes("adv")) return "badge-diff-adv";
      return "badge-diff-inter";
    }

    function render() {
      // Update active tab button style
      tabs.forEach(t => {
        const btn = document.getElementById("tab_" + t.id);
        if (btn) btn.className = t.id === currentTab ? "on" : "";
      });

      // Filter data
      let filtered = data.filter(c => {
        if (filterOnlyImportant && !c.important) return false;
        if (!searchQuery) return true;
        const inTopic = (c.topic || "").toLowerCase().includes(searchQuery);
        const inNotes = (c.notes || []).some(n => n.toLowerCase().includes(searchQuery));
        const inConcepts = (c.concepts || []).some(x => (x.term + " " + x.definition).toLowerCase().includes(searchQuery));
        const inResources = (c.study_resources || []).some(r => r.toLowerCase().includes(searchQuery));
        return inTopic || inNotes || inConcepts || inResources;
      });

      if (filtered.length === 0) {
        if (data.length === 0) {
          document.getElementById("view").innerHTML = `
            <div class="empty-state">
              <svg class="empty-state-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                <polyline points="14 2 14 8 20 8"></polyline>
                <line x1="16" y1="13" x2="8" y2="13"></line>
                <line x1="16" y1="17" x2="8" y2="17"></line>
                <polyline points="10 9 9 9 8 9"></polyline>
              </svg>
              <div class="empty-state-title">Awaiting Lecture Stream</div>
              <div class="empty-state-desc">Live lecture segments, difficulty ratings, and recommended study references will populate automatically as audio progresses.</div>
            </div>`;
        } else {
          document.getElementById("view").innerHTML = `
            <div class="empty-state">
              <div class="empty-state-title">No Matching Records</div>
              <div class="empty-state-desc">No lecture segments match your current search and filter criteria.</div>
            </div>`;
        }
        return;
      }

      let html = "";
      filtered.forEach((c, cIdx) => {
        const timeRange = `${mmss(c.start)} – ${mmss(c.end)}`;
        const importance = c.importance || "Core";
        const difficulty = c.difficulty || "Intermediate";
        const importantBadge = c.important ? `<span class="badge-important">Key Topic</span>` : "";

        let bodyHtml = "";

        if (currentTab === "notes") {
          let notesList = "";
          if (c.notes && c.notes.length) {
            notesList = `<ul class="note-list">` + c.notes.map(n => `<li>${esc(n)}</li>`).join("") + `</ul>`;
          } else {
            notesList = `<div class="empty-text">No general notes in this segment.</div>`;
          }

          let studyFooter = "";
          if (c.study_resources && c.study_resources.length) {
            studyFooter = `
              <div class="mini-resources-wrap">
                <div class="mini-resources-label">Where to Study This Topic:</div>
                ${c.study_resources.map(r => `<span class="mini-resource-tag">${esc(r)}</span>`).join("")}
              </div>
            `;
          }

          bodyHtml = notesList + studyFooter;
        } else if (currentTab === "concepts") {
          if (c.concepts && c.concepts.length) {
            bodyHtml = `<div class="concept-grid">` + c.concepts.map(x => `
              <div class="concept-item">
                <div class="concept-term">${esc(x.term)}</div>
                <div class="concept-def">${esc(x.definition)}</div>
              </div>
            `).join("") + `</div>`;
          } else {
            bodyHtml = `<div class="empty-text">No technical terms defined in this segment.</div>`;
          }
        } else if (currentTab === "quiz") {
          if (c.questions && c.questions.length) {
            bodyHtml = c.questions.map((q, qIdx) => {
              const qId = `q_${cIdx}_${qIdx}`;
              const isAnswerShown = revealedAnswers.has(qId);
              const optionsHtml = q.options && q.options.length ? `
                <ul class="quiz-options">
                  ${q.options.map((opt, i) => `<li class="quiz-option"><strong>${String.fromCharCode(65 + i)}.</strong> ${esc(opt)}</li>`).join("")}
                </ul>
              ` : "";
              const answerContent = isAnswerShown ? `
                <div class="quiz-answer-box">
                  <strong>Confirmed Answer:</strong> ${esc(q.answer)}
                </div>
              ` : "";

              return `
                <div class="quiz-item">
                  <div class="quiz-question">${esc(q.question)}</div>
                  ${optionsHtml}
                  <div class="quiz-answer-toggle">
                    <button class="quiz-answer-btn" onclick="toggleAnswer('${qId}')">
                      ${isAnswerShown ? "Hide Answer" : "Reveal Answer"}
                    </button>
                    ${answerContent}
                  </div>
                </div>
              `;
            }).join("");
          } else {
            bodyHtml = `<div class="empty-text">No review questions generated for this segment.</div>`;
          }
        } else if (currentTab === "resources") {
          if (c.study_resources && c.study_resources.length) {
            bodyHtml = `<div class="resource-list">` + c.study_resources.map(r => `
              <div class="resource-item">
                <svg class="resource-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
                  <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
                </svg>
                <div>${esc(r)}</div>
              </div>
            `).join("") + `</div>`;
          } else {
            bodyHtml = `<div class="empty-text">No dedicated textbook references indexed for this segment.</div>`;
          }
        } else if (currentTab === "actions") {
          if (c.action_items && c.action_items.length) {
            bodyHtml = `<div class="action-list">` + c.action_items.map(a => `
              <div class="action-item">
                <span class="action-bullet"></span>
                <span>${esc(a)}</span>
              </div>
            `).join("") + `</div>`;
          } else {
            bodyHtml = `<div class="empty-text">No action items or assignment deadlines noted.</div>`;
          }
        }

        html += `
          <article class="card ${c.important ? 'important' : ''}">
            <header class="card-head">
              <div class="card-meta-top">
                <div class="pill-group">
                  <span class="timestamp">${timeRange}</span>
                  <span class="badge-pill ${getImportanceClass(importance)}">${esc(importance)}</span>
                  <span class="badge-pill ${getDifficultyClass(difficulty)}">${esc(difficulty)}</span>
                </div>
                <div>${importantBadge}</div>
              </div>
              <h3 class="card-title">${esc(c.topic)}</h3>
            </header>
            <div class="card-body">
              ${bodyHtml}
            </div>
          </article>
        `;
      });

      document.getElementById("view").innerHTML = html;
    }

    // Connect WebSocket
    const protocol = location.protocol === "https:" ? "wss://" : "ws://";
    const ws = new WebSocket(protocol + location.host + "/ws");

    ws.onopen = () => {
      const el = document.getElementById("ws-status");
      if (el) el.innerHTML = `<span class="status-dot"></span><span>Live Session</span>`;
    };

    ws.onclose = () => {
      const el = document.getElementById("ws-status");
      if (el) el.innerHTML = `<span class="status-dot" style="background:#94a3b8"></span><span>Offline</span>`;
    };

    ws.onmessage = e => {
      data.push(JSON.parse(e.data));
      render();
    };

    async function mark() {
      try {
        const r = await fetch("/mark", { method: "POST" });
        const j = await r.json();
        showToast("Marked section at " + mmss(j.at));
      } catch (err) {
        showToast("Failed to mark section");
      }
    }

    render();
  </script>
</body>
</html>
